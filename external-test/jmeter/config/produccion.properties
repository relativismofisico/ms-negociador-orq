# ──────────────────────────────────────────────────────────────────────
# Ambiente: PRODUCCIÓN
# Uso: jmeter -n -t plans/negociador-orq-test-plan.jmx -q config/produccion.properties
#
# Operaciones activas: SOLO lectura
#   El IfController bloquea todas las escrituras cuando env=produccion.
#   Únicamente se ejecuta: POST /validaciones/facturas/vencimiento
#
# Precaución: ejecutar en horario de bajo tráfico y con threads=1..10.
#   No ejecutar threads=100 en producción sin aprobación del equipo de
#   infraestructura y coordinación con el equipo de guardia.
# ──────────────────────────────────────────────────────────────────────

env=produccion
protocol=https
host=prod.negociador-orq.internal
port=443
basePath=
timeout=10000

# JWT con rol ADMINISTRADOR o EMPRESA válido en producción
token=REEMPLAZAR_JWT_PROD

# Factura existente y activa en producción (no modificada por el plan)
facturaId=F-PROD-READ-001
rutEmpresa=12345678-9
rutOperador=98765432-1
fechaProceso=2026-06-07

# Carga conservadora para producción
threads=1
rampup=1
loops=5