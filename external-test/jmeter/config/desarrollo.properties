# ──────────────────────────────────────────────────────────────────────
# Ambiente: DESARROLLO
# Uso: jmeter -n -t plans/negociador-orq-test-plan.jmx -q config/desarrollo.properties
#
# Operaciones activas: lectura + escritura (IfController env != produccion)
# Datos de prueba: asegurarse de que facturaId exista en MongoDB con estado
#   PENDIENTE antes de cada ejecución. Resetearlo entre corridas si se necesita
#   repetibilidad (los escrituras modifican estado de la factura en BD).
# ──────────────────────────────────────────────────────────────────────

env=desarrollo
protocol=http
host=localhost
port=8083
basePath=
timeout=5000

# JWT: el plan lo firma al iniciar (HS384) con -Jjwt.secret=... o la variable de entorno JWT_SECRET
# y lo deja en la propiedad "token". Para usar uno propio: -Jtoken=<jwt>. Ningún archivo trae el secreto.
jwt.subject=perf-tester
jwt.rol=ADMINISTRADOR

# Datos de prueba — deben existir en el ambiente
facturaId=FECI3566
rutEmpresa=900341104
rutOperador=1128384790
fechaProceso=2026-06-07

# Carga por defecto para desarrollo (smoke test)
threads=1
rampup=1
loops=1