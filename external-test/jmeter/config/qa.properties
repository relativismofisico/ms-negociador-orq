# ──────────────────────────────────────────────────────────────────────
# Ambiente: QA
# Uso: jmeter -n -t plans/negociador-orq-test-plan.jmx -q config/qa.properties
#
# Operaciones activas: lectura + escritura (IfController env != produccion)
# Datos de prueba: facturaId debe existir en DB_Facturas_QA con estado PENDIENTE.
#   Las facturas negociadas cambian de estado; repoblar con fixture SQL/Mongo
#   antes de cada ejecución de carga alta (threads >= 10).
# ──────────────────────────────────────────────────────────────────────

env=qa
protocol=http
host=qa.negociador-orq.internal
port=8083
basePath=
timeout=8000

# JWT: el plan lo firma al iniciar (HS384) con -Jjwt.secret=... o la variable de entorno JWT_SECRET
# del ambiente (o se pasa uno propio con -Jtoken=...). Ningún archivo trae el secreto ni un token.

# Datos de prueba QA
facturaId=F-PERF-QA-001
rutEmpresa=12345678-9
rutOperador=98765432-1
fechaProceso=2026-06-07

# Carga por defecto para QA
threads=10
rampup=10
loops=10
