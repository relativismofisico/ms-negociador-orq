server:
  port: 8083

spring:
  application:
    # servicioOrigen de los eventos de auditoría (ms-commons-util)
    name: ms-negociador-orq
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 5000
      validation-timeout: 2000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
  # Flyway — Fase 13 del pipeline de mantenibilidad. baseline-on-migrate
  # marca el esquema YA existente (dev) como "ya en V1". Tabla de historial
  # DEDICADA (no la default `flyway_schema_history`): varios de estos
  # backends comparten físicamente el schema `dbcompany`, y esa tabla es
  # única por schema, no por aplicación. qa/prod la desactivan
  # explícitamente hasta confirmar su esquema real.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history_negociador
  data:
    mongodb:
      uri: mongodb://localhost:27017/DB_Facturas
      database: DB_Facturas
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all #Permite comfirmar el mensaje solo cuando todas las replicas lo guardan
      properties:
        enable.idempotence: true #Evita duplicados

topics:
  liquidacion: liquidacion.solicitada
  otp-request: otp.requested
  otp-validate: otp.validate
  otp-validate-response: otp.validate.response
  notificacion-email: notificacion.email
  liquidacion-fallida: liquidacion.fallida

negociacion:
  dias-minimos-vencimiento: 10

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

facturas:
  vencimiento:
    cron: "0 0 1 * * *"

# ─────────────────────────────────────────────────────────────
# Seguridad corporativa — modificar roles aquí sin recompilar
# ─────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Secreto HMAC sin valor por defecto: el arranque falla si falta la variable o si no es Base64 de
# 48 a 63 bytes (ver README, "Variables de entorno requeridas").
security:
  jwt:
    secret: ${JWT_SECRET}
  # Cuenta de servicio de ms-liquidador-neg (Basic Auth): usuario y hash bcrypt por entorno, sin default. El arranque
  # falla si faltan o si el hash no tiene formato bcrypt (ver README, "Cuenta de servicio de ms-liquidador-neg").
  service-credentials:
    ms-liquidador-neg:
      username: ${LIQUIDADOR_SERVICE_USERNAME}
      password: ${LIQUIDADOR_SERVICE_PASSWORD_HASH}
      roles:
        - OPERARIO
  roles:
    # POST /negociar/factura
    negociacion:
      - ADMINISTRADOR
      - EMPRESA
      - OPERARIO
    # POST /negociaciones/{id}/endosos
    endoso:
      - ADMINISTRADOR
      - EMPRESA
      - OPERARIO
    # POST /negociaciones/solicitar-otp  y  POST /negociaciones/confirmar-otp
    otp:
      - ADMINISTRADOR
      - EMPRESA
      - OPERARIO
    # POST /validaciones/facturas/vencimiento
    validacion:
      - ADMINISTRADOR
      - OPERARIO
      - EMPRESA
      - FONDEADOR
    # GET/PUT /companies/{companyId}/cupo-propio-fondeo
    cupo-propio:
      - ADMINISTRADOR
      - EMPRESA
    # PATCH /companies/{supplierId}/indirect-funder-offers/{offerId}/cupo/recargar
    recarga-cupo-indirecto:
      - ADMINISTRADOR
      - EMPRESA
    # POST /tasas/conversion
    conversion-tasa:
      - ADMINISTRADOR
      - OPERARIO
      - EMPRESA
      - FONDEADOR

# ─────────────────────────────────────────────────────────────
# Rate limiting / lockout — estado en Redis, compartido por todas
# las instancias del servicio
# ─────────────────────────────────────────────────────────────
rate-limit:
  ip:
    enabled: true
    max-requests: 100
    window-seconds: 60

login-lockout:
  max-attempts: 5
  window-minutes: 15

# Log de texto plano con la trazabilidad de ms-commons-util (MDC): requestId de correlación entre microservicios,
# usuario (sub del JWT ya validado) y empresa (claim emp). %logger{36} da la clase sin costo; NO usar %M (método):
# recorre el stack en cada línea. Si hace falta el método, va como texto dentro del propio mensaje.
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%5p][%logger{36}][req=%X{requestId:-} user=%X{user:-} emp=%X{companyId:-}] %m%n%wEx"
  level:
    # Pool de conexiones: arranque, cierre y errores de conexión, sin la configuración (URL y usuario) que HikariConfig imprime en DEBUG
    com.zaxxer.hikari: INFO
    # Imprimen en DEBUG el cuerpo completo de peticiones y respuestas (con credenciales): fijos en INFO
    org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor: INFO
    org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor: INFO
    org.springframework.security: DEBUG

# Log de auditoría (ms-commons-util → ms-auditoria-util), publicado por el outbox. auditoria.enabled=false lo apaga.
auditoria:
  topic: ${AUDITORIA_TOPIC:auditoria.accion}
