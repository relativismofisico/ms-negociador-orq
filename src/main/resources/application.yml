server:
  port: 8083

spring:
  application:
    # servicioOrigen de los eventos de auditoría (ms-commons-util)
    name: ms-negociador-orq
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
  datasource:
    url: jdbc:mysql://${DB_HOST:dbcompany.cn48sgciaax1.us-east-2.rds.amazonaws.com}:3306/dbcompany?useSSL=false&serverTimezone=UTC
    username: ${DB_USER:desarrollador}
    password: ${DB_PASSWORD:Juliana1987****}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 5000
      validation-timeout: 2000
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
  # Flyway — Fase 13 del pipeline de mantenibilidad. baseline-on-migrate
  # marca el esquema YA existente (dev) como "ya en V1". Tabla de historial
  # DEDICADA (no la default `flyway_schema_history`): varios de estos
  # backends comparten físicamente el schema `dbcompany`, y esa tabla es
  # única por schema, no por aplicación. qa/prod la desactivan
  # explícitamente hasta confirmar su esquema real.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    table: flyway_schema_history_negociador
  data:
    mongodb:
      uri: mongodb://localhost:27017/DB_Facturas
      database: DB_Facturas
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all #Permite comfirmar el mensaje solo cuando todas las replicas lo guardan
      properties:
        enable.idempotence: true #Evita duplicados

topics:
  liquidacion: liquidacion.solicitada
  otp-request: otp.requested
  otp-validate: otp.validate
  otp-validate-response: otp.validate.response
  notificacion-email: notificacion.email
  liquidacion-fallida: liquidacion.fallida

negociacion:
  dias-minimos-vencimiento: 10

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

facturas:
  vencimiento:
    cron: "0 0 1 * * *"

