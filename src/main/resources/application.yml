      properties:
        enable.idempotence: true #Evita duplicados

topics:
  liquidacion: liquidacion.solicitada
  otp-request: otp.requested
  otp-validate: otp.validate
  otp-validate-response: otp.validate.response
  notificacion-email: notificacion.email
  liquidacion-fallida: liquidacion.fallida

negociacion:
  dias-minimos-vencimiento: 10

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
    try-it-out-enabled: true
  default-produces-media-type: application/json
  default-consumes-media-type: application/json

facturas:
  vencimiento:
    cron: "0 0 1 * * *"

