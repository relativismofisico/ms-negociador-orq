server:
  port: 8083

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
  datasource:
    url: jdbc:mysql://dbcompany.cn48sgciaax1.us-east-2.rds.amazonaws.com:3306/dbcompany?useSSL=false&serverTimezone=UTC
    username: desarrollador
    password: Juliana1987****
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
  data:
    mongodb:
      uri: mongodb://localhost:27017/DB_Facturas
      database: DB_Facturas
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all #Permite comfirmar el mensaje solo cuando todas las replicas lo guardan
      properties:
        enable.idempotence: true #Evita duplicados
    consumer:
      group-id: ms-negociador-orq
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      enable-auto-commit: false
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.value.default.type: com.negociadororq.domain.event.OtpValidatedEvent
        spring.json.type.mapping: com.security.ms_security.domain.event.OtpValidatedEvent:com.negociadororq.domain.event.OtpValidatedEvent
        reconnect.backoff.ms: 1000 #Espera un seg e inicia reconexion
        reconnect.backoff.max.ms: 10000 #Reintenta 10 veces
        auto-offset-reset: earliest #Toma mensajes desde el inicio del topic


topics:
  liquidacion: liquidacion.solicitada
  otp-request: otp.requested
  otp-validate: otp.validate
  otp-validate-response: otp.validate.response
  notificacion-email: notificacion.email


