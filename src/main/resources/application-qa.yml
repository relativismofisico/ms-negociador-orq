# ─────────────────────────────────────────────────────────────
# Perfil QA — ambiente de pruebas
# ─────────────────────────────────────────────────────────────
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/DB_Facturas_QA}
      database: ${MONGO_DB:DB_Facturas_QA}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
  # ---- Esquema de BD: solo validar, nunca alterar (Fase 13 - Flyway gobierna el esquema) ----
  # Este perfil no sobreescribía ddl-auto y heredaba "update" del
  # application.yml base sin que nadie lo hubiera decidido — corregido acá.
  jpa:
    hibernate:
      ddl-auto: validate
  # Flyway deshabilitado en QA hasta confirmar con acceso real de
  # infraestructura el estado actual de este esquema.
  flyway:
    enabled: false

security:
  jwt:
    secret: ${JWT_SECRET}
  roles:
    negociacion:
      - ADMINISTRADOR
      - EMPRESA
      - OPERARIO
    endoso:
      - ADMINISTRADOR
      - EMPRESA
      - FONDEADOR
    otp:
      - ADMINISTRADOR
      - EMPRESA
      - FONDEADOR
    validacion:
      - ADMINISTRADOR
      - OPERARIO
      - EMPRESA
      - FONDEADOR
    # POST /tasas/conversion
    conversion-tasa:
      - ADMINISTRADOR
      - OPERARIO
      - EMPRESA
      - FONDEADOR