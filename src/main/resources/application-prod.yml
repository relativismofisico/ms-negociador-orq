# ─────────────────────────────────────────────────────────────
# Perfil PROD — producción
# NUNCA hardcodear credenciales — todas las variables deben
# provenir de variables de entorno o secrets manager.
# ─────────────────────────────────────────────────────────────
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: 5
  data:
    mongodb:
      uri: ${MONGO_URI}
      database: ${MONGO_DB}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  # Flyway deshabilitado en Prod hasta confirmar con acceso real de
  # infraestructura el estado actual de este esquema (Fase 13).
  flyway:
    enabled: false

security:
  jwt:
    secret: ${JWT_SECRET}
  roles:
    negociacion:
      - ADMINISTRADOR
      - EMPRESA
      - OPERARIO
    endoso:
      - ADMINISTRADOR
      - EMPRESA
      - FONDEADOR
    otp:
      - ADMINISTRADOR
      - EMPRESA
      - FONDEADOR
    validacion:
      - ADMINISTRADOR
      - OPERARIO
      - EMPRESA
      - FONDEADOR
    # POST /tasas/conversion
    conversion-tasa:
      - ADMINISTRADOR
      - OPERARIO
      - EMPRESA
      - FONDEADOR

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false