# ─────────────────────────────────────────────────────────────
# Perfil PROD — producción
# NUNCA hardcodear credenciales — todas las variables deben
# provenir de variables de entorno o secrets manager.
# ─────────────────────────────────────────────────────────────
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/dbcompany?useSSL=true&serverTimezone=UTC&requireSSL=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  data:
    mongodb:
      uri: ${MONGO_URI}
      database: ${MONGO_DB}
  kafka:
    bootstrap-servers: ${KAFKA_SERVERS}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

security:
  jwt:
    secret: ${JWT_SECRET}
  roles:
    negociacion:
      - ADMINISTRADOR
      - EMPRESA
      - OPERARIO
    endoso:
      - ADMINISTRADOR
      - EMPRESA
      - FONDEADOR
    otp:
      - ADMINISTRADOR
      - EMPRESA
      - FONDEADOR
    validacion:
      - ADMINISTRADOR
      - OPERARIO
      - EMPRESA
      - FONDEADOR

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false