# ─────────────────────────────────────────────────────────────
# Perfil DEV — desarrollo local
# ─────────────────────────────────────────────────────────────
spring:
  # Base de datos: la misma de application.yml, ${DB_URL} / ${DB_USER} / ${DB_PASSWORD} por entorno, sin
  # credenciales literales en ningún perfil (ver README, "Base de datos: variables obligatorias", y .env.example).
  data:
    mongodb:
      uri: mongodb://localhost:27017/DB_Facturas
      database: DB_Facturas
  kafka:
    bootstrap-servers: localhost:9092

# Swagger accesible sin token en desarrollo (SecurityConfig permite /swagger-ui/**)
# Para forzar JWT también en swagger, eliminar los matchers permitAll en SecurityConfig