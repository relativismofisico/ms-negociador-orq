def jacocoExcludes = [
        // Capa de infraestructura — adaptadores JPA, MongoDB, Kafka, security config, scheduler, PDF
        'com/negociadororq/infrastructure/**',
        // Clase principal de Spring Boot
        'com/negociadororq/MsNegociadorOrqApplication.class',
        // DTOs — código generado por Lombok (equals/hashCode/builder producen branches vacíos)
        'com/negociadororq/application/dto/**',
        // Eventos de dominio — solo portadores de datos Lombok
        'com/negociadororq/domain/event/**',
        // Modelos de dominio — portadores de datos Lombok (800+ branches en equals/hashCode)
        'com/negociadororq/domain/model/**',
        // Enums de dominio — constantes sin lógica ramificable
        'com/negociadororq/domain/enums/**',
        // Mappers — sin lógica de negocio propia
        'com/negociadororq/application/mapper/**',
        // Puertos hexagonales — interfaces de contrato sin implementación propia
        'com/negociadororq/application/port/**',
        // Interfaces de servicio puras (JaCoCo registra branches artefactuales en interfaces)
        'com/negociadororq/application/service/FirmaEndosoService.class',
        'com/negociadororq/application/service/NegociacionFactoringComfirmingService.class',
]

jacocoTestReport {
    dependsOn test // primero ejecuta los tests
    reports {
        xml.required = true
        csv.required = false
        html.required = true // genera reporte navegable
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
    afterEvaluate {
        classDirectories.setFrom(
                files(classDirectories.files.collect {
                    fileTree(dir: it, exclude: jacocoExcludes)
                })
        )
    }
}

jacocoTestCoverageVerification {
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoExcludes)
        }))
    }
    violationRules {
        rule {
            enabled = true
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
        }
        rule {
            enabled = true
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }

    }
}
jacocoTestReport {
    dependsOn test
}