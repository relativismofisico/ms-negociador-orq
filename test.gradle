// Los source sets automatedTest/architectureTest se definen en build.gradle,
// antes del bloque configurations {} — obligatorio en Gradle 9 (ver comentario
// allí). Este script solo los consume.

// ─────────────────────────────────────────────────────────────────────────────
// Helper: resuelve el ambiente activo.
// Prioridad: variable de entorno AMBIENTE_PIPE > propiedad Gradle -Penv > 'dev'
// ─────────────────────────────────────────────────────────────────────────────
def resolverAmbiente = {
    def envPipe = System.getenv('AMBIENTE_PIPE')
    if (envPipe && !envPipe.isBlank()) return envPipe.trim()
    def propEnv = project.findProperty('env')
    if (propEnv) return propEnv.toString().trim()
    return 'dev'
}

// ─────────────────────────────────────────────────────────────────────────────
// task: automatedTest — Suite COMPLETA (@full). Task principal de CI/CD.
// Uso: ./gradlew automatedTest [-Penv=qa]
//      AMBIENTE_PIPE=qa ./gradlew automatedTest
// ─────────────────────────────────────────────────────────────────────────────
task automatedTest(type: Test) {
    description = 'Runs Karate acceptance tests — suite completa (@full)'
    group = 'verification'

    testClassesDirs = sourceSets.automatedTest.output.classesDirs
    classpath       = sourceSets.automatedTest.runtimeClasspath

    useJUnitPlatform()
    filter {
        includeTestsMatching '*.runner.FullRunner'
    }

    systemProperty 'karate.env', resolverAmbiente()

    outputs.upToDateWhen { false }
    finalizedBy jacocoTestReport
}

// ─────────────────────────────────────────────────────────────────────────────
// task: smokeTest — Auth + contratos HTTP (@smoke). Sin datos en BD. Rápido.
// Uso: ./gradlew smokeTest
// ─────────────────────────────────────────────────────────────────────────────
task smokeTest(type: Test) {
    description = 'Runs Karate smoke tests (@smoke) — auth y contratos básicos'
    group = 'verification'

    testClassesDirs = sourceSets.automatedTest.output.classesDirs
    classpath       = sourceSets.automatedTest.runtimeClasspath

    useJUnitPlatform()
    filter {
        includeTestsMatching '*.runner.SmokeRunner'
    }

    systemProperty 'karate.env', resolverAmbiente()
    outputs.upToDateWhen { false }
}

// ─────────────────────────────────────────────────────────────────────────────
// task: regressionTest — Flujos de negocio completos (@regression).
// Uso: AMBIENTE_PIPE=qa ./gradlew regressionTest
// ─────────────────────────────────────────────────────────────────────────────
task regressionTest(type: Test) {
    description = 'Runs Karate regression tests (@regression) — flujos de negocio'
    group = 'verification'

    testClassesDirs = sourceSets.automatedTest.output.classesDirs
    classpath       = sourceSets.automatedTest.runtimeClasspath

    useJUnitPlatform()
    filter {
        includeTestsMatching '*.runner.RegressionRunner'
    }

    systemProperty 'karate.env', resolverAmbiente()
    outputs.upToDateWhen { false }
}

// ─────────────────────────────────────────────────────────────────────────────
// task: productionTest — Solo pruebas @production-safe (lectura, sin efectos).
// Fuerza karate.env=prod. Requiere BASE_URL y tokens pre-obtenidos como env vars.
// Uso: AMBIENTE_PIPE=prod BASE_URL=https://api.prod.com TEST_TOKEN_ADMIN=... ./gradlew productionTest
// ─────────────────────────────────────────────────────────────────────────────
task productionTest(type: Test) {
    description = 'Runs production-safe Karate tests (@production-safe) — solo lectura'
    group = 'verification'

    testClassesDirs = sourceSets.automatedTest.output.classesDirs
    classpath       = sourceSets.automatedTest.runtimeClasspath

    useJUnitPlatform()
    filter {
        includeTestsMatching '*.runner.ProductionRunner'
    }

    systemProperty 'karate.env', 'prod'

    doFirst {
        if (!System.getenv('BASE_URL')) {
            throw new GradleException(
                'productionTest requiere BASE_URL apuntando al ambiente de producción.\n' +
                'Ejemplo: BASE_URL=https://api.prod.com ./gradlew productionTest'
            )
        }
    }

    outputs.upToDateWhen { false }
}

// ─────────────────────────────────────────────────────────────────────────────
// Tests unitarios y de arquitectura (sin cambios)
// ─────────────────────────────────────────────────────────────────────────────
test {
    jvmArgs "-Xms128m", "-Xmx512m", "-XX:+DisableExplicitGC"
    finalizedBy jacocoTestReport

    // Docker Desktop >= 29 responde HTTP 400 al probe GET /info de Testcontainers
    // cuando docker-java no fija la versión de la API. Si DOCKER_API_VERSION está
    // en el entorno, se reenvía al JVM de test como env var y system property
    // (docker-java lee cualquiera de las dos). No-op en CI con Docker Engine
    // estándar, donde la autodetección de Testcontainers ya funciona sola.
    def dockerApiVersion = providers.environmentVariable('DOCKER_API_VERSION')
    if (dockerApiVersion.present) {
        environment 'DOCKER_API_VERSION', dockerApiVersion.get()
        systemProperty 'api.version', dockerApiVersion.get()
    }
}

tasks.register('architectureTest', Test) {
    useJUnitPlatform()
    description = 'Runs architecture tests.'
    group       = 'verification'

    testClassesDirs = sourceSets.architectureTest.output.classesDirs
    classpath       = sourceSets.architectureTest.runtimeClasspath
}

// ─────────────────────────────────────────────────────────────────────────────
// Herramientas de análisis estático (sin cambios)
// ─────────────────────────────────────────────────────────────────────────────
checkstyle {
    final String checkstyleConfigFile = System.getenv('CHECKSTYLE_CONFIG_FILE') != null
            ? System.getenv('CHECKSTYLE_CONFIG_FILE')
            : "${rootProject.projectDir}/config/checkstyle/checkstyle.xml"

    configFile = file(checkstyleConfigFile)
    toolVersion = '10.17.0'
    sourceSets = [sourceSets.main]
    ignoreFailures = false
    maxWarnings = 0
}

pmd {
    toolVersion = '7.3.0'
    ruleSetFiles = files("${rootProject.projectDir}/config/pmd/ruleset.xml")
    ruleSets = []
    sourceSets = [sourceSets.main]
    ignoreFailures = false
    consoleOutput = true
}

spotbugs {
    toolVersion = '4.8.6'
    excludeFilter = file("${rootProject.projectDir}/config/spotbugs/exclude.xml")
    ignoreFailures = false
}

spotbugsMain {
    reports {
        xml.required = true
        html.required = true
    }
}
check.dependsOn architectureTest
