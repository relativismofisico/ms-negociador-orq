# =====================================================================
# SonarQube — ms-negociador-orq
# =====================================================================

sonar.projectKey=ms-negociador-orq
sonar.projectName=ms-negociador-orq
sonar.projectVersion=0.0.1-SNAPSHOT

# Fuentes y pruebas
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.source=17
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test

# Cobertura JaCoCo
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml

# Reportes de herramientas externas
sonar.java.checkstyle.reportPaths=build/reports/checkstyle/main.xml
sonar.java.pmd.reportPaths=build/reports/pmd/main.xml
sonar.java.spotbugs.reportPaths=build/reports/spotbugs/main.xml

# Exclusiones (DTOs, enums, modelos de dominio sin lógica)
sonar.exclusions=\
    **/dto/**, \
    **/enums/**, \
    **/domain/model/**, \
    **/domain/event/**, \
    **/MsNegociadorOrqApplication.java

# Exclusiones de cobertura (mismo criterio)
sonar.coverage.exclusions=\
    **/dto/**, \
    **/enums/**, \
    **/domain/model/**, \
    **/domain/event/**, \
    **/MsNegociadorOrqApplication.java

# Encoding
sonar.sourceEncoding=UTF-8

# Duplicados: umbral razonable para código empresarial
sonar.cpd.java.minimumLines=10
sonar.cpd.java.minimumTokens=100