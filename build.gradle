plugins {
    id 'pmd'
    id 'java'
    id 'groovy'
    id 'jacoco'
    id 'checkstyle'
    id 'org.sonarqube' version '5.1.0.4882'
    id 'com.github.spotbugs' version '6.1.7'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
}


version = '1.0.0'
group = 'com.negociadororq'

// Gradle 9 quitó `sourceCompatibility`/`targetCompatibility` como propiedades
// a nivel de proyecto; van dentro del bloque `java {}`. Mismo valor y
// comportamiento, sin migrar a toolchain (eso es un cambio aparte).
java {
    sourceCompatibility = '17'
}

jacoco {
    toolVersion = '0.8.13'
}

spotbugs {
    excludeFilter = file('config/spotbugs/exclude.xml')
}

sonarqube {
    properties {
        property 'sonar.projectKey', 'ms-negociador-orq'
        property 'sonar.projectName', 'ms-negociador-orq'
        property 'sonar.projectVersion', version
        property 'sonar.sources', 'src/main/java'
        property 'sonar.tests', 'src/test/java,src/test/groovy,src/automated-test/java'
        property 'sonar.java.source', '17'
        property 'sonar.sourceEncoding', 'UTF-8'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                'build/reports/jacoco/test/jacocoTestReport.xml'
        property 'sonar.java.checkstyle.reportPaths',
                'build/reports/checkstyle/main.xml'
        property 'sonar.java.pmd.reportPaths',
                'build/reports/pmd/main.xml'
        property 'sonar.java.spotbugs.reportPaths',
                'build/reports/spotbugs/main.xml'
        property 'sonar.coverage.exclusions',
                '**/dto/**,**/*Application.java'
    }
}

repositories {
    mavenCentral()
    // PILOTO Fase 11 (pipeline de mantenibilidad) — ms-commons-util todavía no
    // se publica a GitHub Packages, se prueba vía mavenLocal() hasta que se
    // decida esa parte.
    mavenLocal()
}

// Los source sets deben definirse ANTES del bloque configurations {}: si no,
// la referencia a automatedTestImplementation/architectureTestImplementation
// crea esas configuraciones con un nombre reservado (Gradle las crearía al
// registrar el source set). Deprecado en Gradle 8, ERROR en Gradle 9.
sourceSets {
    automatedTest {
        java {
            srcDirs = ['src/automated-test/java']
            compileClasspath += sourceSets.main.output + sourceSets.test.output
            runtimeClasspath += sourceSets.main.output + sourceSets.test.output
        }
        resources {
            srcDirs = ['src/automated-test/resources']
        }
    }

    architectureTest {
        java {
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
            srcDir file('src/architecture-test/java')
        }
        resources.srcDir file('src/architecture-test/resources')
    }
}

configurations {
    automatedTestImplementation.extendsFrom testImplementation
    automatedTestRuntimeOnly.extendsFrom testRuntimeOnly
    architectureTestImplementation.extendsFrom testImplementation
    architectureTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // MongoDB (quita JPA/Postgres/MySQL)
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.mysql:mysql-connector-j:8.3.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // Flyway — migraciones versionadas de esquema (Fase 13 del pipeline de
    // mantenibilidad). Dependencia de runtime pura, sin plugin de Gradle.
    implementation 'org.flywaydb:flyway-mysql'

    // Source: https://mvnrepository.com/artifact/com.openhtmltopdf/openhtmltopdf-pdfbox
    implementation("com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10")
    // Mustache template engine (plantillas de documentos formales, tabla messages_templates)
    implementation("com.github.spullara.mustache.java:compiler:0.9.10")
    //Kafka
    implementation 'org.springframework.kafka:spring-kafka'
    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Security — OAuth2 Resource Server + JWT
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Redis — estado de rate-limiting/lockout compartido entre instancias
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    // ShedLock — lock distribuido para @Scheduled corriendo en varias instancias
    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.13.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-redis-spring:5.13.0'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    // JWT — misma librería que el generador (garantiza compatibilidad de algoritmo y firma)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // ms-commons-util — IpUtils/RateLimitFilter extraídos en la Fase 11 del
    // pipeline de mantenibilidad (PILOTO vía mavenLocal(), ver repositories{})
    implementation 'com.factoring:ms-commons-util:0.2.0'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Spock Framework — pruebas unitarias en Groovy
    testImplementation 'org.apache.groovy:groovy-all:4.0.21'
    testImplementation('org.spockframework:spock-core:2.4-groovy-4.0') {
        exclude group: 'org.apache.groovy'
    }
    testImplementation('org.spockframework:spock-spring:2.4-groovy-4.0') {
        exclude group: 'org.apache.groovy'
    }

    // SpotBugs annotations (for @SuppressWarnings integration)
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'

    // ArchUnit — pruebas de arquitectura
    architectureTestImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // Karate — pruebas funcionales automatizadas
    automatedTestImplementation 'com.intuit.karate:karate-junit5:1.4.0'
    // JJWT explícito para JwtTestHelper (jjwt-api está en implementation pero no en automatedTest classpath)
    automatedTestImplementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    automatedTestRuntimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
    automatedTestRuntimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.0"	}
}

tasks.named('test') {
    useJUnitPlatform()
}
test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // siempre genera reporte después de los tests

}


apply from: "${rootProject.projectDir}/test.gradle"
apply from: "${rootProject.projectDir}/coverage.gradle"
