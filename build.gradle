plugins {
    id 'pmd'
    id 'java'
    id 'groovy'
    id 'jacoco'
    id 'checkstyle'
    id 'org.sonarqube' version '5.1.0.4882'
    id 'com.github.spotbugs' version '6.0.26'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
}


version = '1.0.0'
group = 'com.negociadororq'
sourceCompatibility = '17'

jacoco {
    toolVersion = '0.8.12'
}

repositories {
    mavenCentral()
}

configurations {
    automatedTestImplementation.extendsFrom testImplementation
    automatedTestRuntimeOnly.extendsFrom testRuntimeOnly
    architectureTestImplementation.extendsFrom testImplementation
    architectureTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
    // Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // MongoDB (quita JPA/Postgres/MySQL)
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'

    implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.mysql:mysql-connector-j:8.3.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

    // Source: https://mvnrepository.com/artifact/com.openhtmltopdf/openhtmltopdf-pdfbox
    implementation("com.openhtmltopdf:openhtmltopdf-pdfbox:1.0.10")
    //Kafka
    implementation 'org.springframework.kafka:spring-kafka'
    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'

    // Security — OAuth2 Resource Server + JWT
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.security:spring-security-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    // JWT — misma librería que el generador (garantiza compatibilidad de algoritmo y firma)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Spock Framework — pruebas unitarias en Groovy
    testImplementation 'org.apache.groovy:groovy-all:4.0.21'
    testImplementation('org.spockframework:spock-core:2.4-groovy-4.0') {
        exclude group: 'org.apache.groovy'
    }
    testImplementation('org.spockframework:spock-spring:2.4-groovy-4.0') {
        exclude group: 'org.apache.groovy'
    }

    // SpotBugs annotations (for @SuppressWarnings integration)
    compileOnly 'com.github.spotbugs:spotbugs-annotations:4.8.6'

    // ArchUnit — pruebas de arquitectura
    architectureTestImplementation 'com.tngtech.archunit:archunit-junit5:1.3.0'

    // Karate — pruebas funcionales automatizadas
    automatedTestImplementation 'com.intuit.karate:karate-junit5:1.4.0'
    // JJWT explícito para JwtTestHelper (jjwt-api está en implementation pero no en automatedTest classpath)
    automatedTestImplementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    automatedTestRuntimeOnly    'io.jsonwebtoken:jjwt-impl:0.12.6'
    automatedTestRuntimeOnly    'io.jsonwebtoken:jjwt-jackson:0.12.6'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.0.0"	}
}

tasks.named('test') {
    useJUnitPlatform()
}
test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport // siempre genera reporte después de los tests

}


apply from: "${rootProject.projectDir}/test.gradle"
apply from: "${rootProject.projectDir}/coverage.gradle"